services:
  - type: web
    name: satquery-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/satquery/ui/app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SATQUERY_ENGINE_MODE
        value: standalone
