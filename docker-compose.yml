version: '3.8'

services:
  # AeroLens AI — FastAPI Remote Sensing Backend Core
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aerolens-backend:latest
    container_name: aerolens-backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash-vl:free}
      - SATQUERY_FORCE_CPU=${SATQUERY_FORCE_CPU:-0}
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./adapters:/app/adapters
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # AeroLens AI — Next.js 15 Aerospace Ground Station Cockpit
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    image: aerolens-frontend:latest
    container_name: aerolens-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: aerolens-network
